name: L0-E — CI non-régression Core BrainAI

on:
  push:
  pull_request:

permissions:
  contents: read          # aucun secret, aucune écriture

jobs:
  core-non-regression:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # Gate du seul test facturable maintenu FAUX de façon explicite (fail-closed) :
      # BRAINAI_JALON_LLM défini mais vide → test_real_claude_brief s'auto-skippe (0 appel LLM).
      BRAINAI_JALON_LLM: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.9 (requires-python >= 3.9 ; runtime de la baseline L0-E)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Installer pytest (Core = stdlib pur, dependencies=[])
        run: python -m pip install "pytest==8.4.2"

      - name: Suite déterministe (0 LLM ; billable auto-skippé)
        run: python -m pytest -p no:cacheprovider

      - name: Registre canonique — validation SANS régénération
        run: python scripts/generate_canonical_registry.py --check
