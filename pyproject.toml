[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scc-brainai-bootstrap"
version = "0.14.0"
description = "Bootstrap de BrainAI — premier exécutable de démarrage : config, Control Plane, Patrimony, Memory, Knowledge, Event Bus, premiers Agents, puis 'BrainAI READY'. Stdlib pur, déterministe, sans réseau."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Seror Créative" }]
keywords = ["scc", "brainai", "bootstrap", "startup"]
dependencies = []

# Extras OPTIONNELS — la base reste **stdlib pur / 0 réseau / $0**. Les adaptateurs OpenAI (L6A) et Gemini (L6B)
# lazy-importent leur SDK et fail-close proprement s'il est absent ; l'extra rend l'activation **reproductible**
# (`pip install .[openai]` / `.[gemini]`), nécessaire uniquement pour l'appel réel gated (GO-secrets). Aucune
# installation n'est réalisée par déclaration. Borne Gemini ≥ 1.22.0 : version qui expose
# `response_json_schema` dans GenerateContentConfig (JSON Schema standard requis par l'adaptateur L6B).
[project.optional-dependencies]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.22.0"]

[project.scripts]
scc-brainai = "scc_brainai_bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
